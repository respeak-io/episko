name: ci

# Compile-and-test gate for every PR and every push to dev or main. The frontend
# typechecks, both supported OSes still build, and both test suites run. It's what
# catches "someone broke the Windows build" (or the macOS one) before it merges,
# since the cfg-gated platform code only compiles on its own OS — and the suites run
# on both platforms for the same reason: half the Rust tests are cfg-gated too.
#
# The OS edge (PTY, windows, tray) still has no automated net and is verified by
# running the app — see CLAUDE.md.
#
# Work flows dev -> main, so dev is where the churn is and where a break must surface
# first. main is kept too: it re-gates the dev -> main PR and covers a direct push.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  # Every release describes itself. The gate is on the dev → main pull request rather
  # than on the tag, because a tag that fails has already had the decision to ship made
  # behind it — this fails while the fix is still one command.
  changelog:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # No deps, so no cache. Left on, setup-node reads `packageManager` from
          # package.json and shells out to pnpm — which this job has no reason to
          # install, and which fails the gate before it ever reads the changelog.
          package-manager-cache: false
      - name: CHANGELOG.md has an Unreleased section
        run: node scripts/changelog.mjs check

  build-check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # Read from .nvmrc so CI and a local `nvm use` cannot drift. That drift is not
      # hypothetical: this workflow pinned Node 20 while dev machines ran newer, and
      # `globalThis.navigator` (Node 21+) made two vitest suites pass locally and die
      # here. One file is now the single source of truth for both.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Typechecks both TS projects (`src/` and `test/` — see docs/testing.md for why
      # they are separate) and builds the frontend. Must run before cargo, because
      # Tauri's `generate_context!` embeds `frontendDist` (../dist) at compile time
      # and errors if it's missing.
      - name: Build frontend (tsc + vite)
        run: pnpm build

      - name: Frontend tests (vitest)
        run: pnpm test

      - name: Cargo check
        working-directory: ./src-tauri
        run: cargo check --locked

      # Plain `cargo test` skips `#[ignore]`d tests, which is what we want: those are
      # reserved for checks that invoke `claude` (on PATH, and sometimes with auth and
      # tokens), so they belong to the release checklist, not a PR gate.
      #
      # `read_bg_log_finds_a_log_claude_code_actually_wrote` is deliberately NOT in that
      # tier. It invokes nothing and costs a handful of `read_dir`s; it just needs a
      # machine that has USED Claude Code, so it skips here and fires on a developer's
      # laptop. `--ignored` runs monthly; this runs twenty times a day, and it is the
      # only place this feature's one real oracle exists.
      #
      # CLAUDE_CODE_TMPDIR is poisoned on purpose. Every input to `bg_log_roots` — the
      # OS, the temp root, this variable, the uid — is a parameter, which is what lets
      # the macOS leg assert the Windows row of the table and vice versa. If this ever
      # goes red, somebody has reached for `std::env::var` inside the resolver and half
      # the table has quietly stopped being testable from the other machine, which is
      # precisely how the background-shell log went unresolvable for months with every
      # gate green. TMPDIR itself is deliberately NOT poisoned: rustc, the linker and
      # cargo's own tempfile use it for real work, and a gate must fail because of the
      # diff.
      - name: Cargo test
        working-directory: ./src-tauri
        env:
          CLAUDE_CODE_TMPDIR: ${{ runner.temp }}/episko-no-such-root
        run: cargo test --locked

      # A real gate as of Phase 3 — a linter that can't fail is decoration. Note
      # `-D warnings` is what does the gating: plain `cargo clippy` exits 0 with
      # warnings, so dropping the old `|| true` alone would have changed nothing.
      #
      # This runs on both legs deliberately. Clippy only lints the arms that compile
      # for its own target, so the Windows leg never sees the `cfg(not(windows))` /
      # `cfg(target_os = "macos")` code and vice versa — the same reason the build and
      # test steps above are a matrix.
      - name: Clippy
        working-directory: ./src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
