name: ci

# Compile-and-test gate for every PR and every push to dev or main. The frontend
# typechecks, both supported OSes still build, and both test suites run. It's what
# catches "someone broke the Windows build" (or the macOS one) before it merges,
# since the cfg-gated platform code only compiles on its own OS — and the suites run
# on both platforms for the same reason: half the Rust tests are cfg-gated too.
#
# The OS edge (PTY, windows, tray) still has no automated net and is verified by
# running the app — see CLAUDE.md.
#
# Work flows dev -> main, so dev is where the churn is and where a break must surface
# first. main is kept too: it re-gates the dev -> main PR and covers a direct push.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build-check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Typechecks (tsc) and builds the frontend. Must run before cargo, because
      # Tauri's `generate_context!` embeds `frontendDist` (../dist) at compile time
      # and errors if it's missing.
      - name: Build frontend (tsc + vite)
        run: pnpm build

      - name: Frontend tests (vitest)
        run: pnpm test

      - name: Cargo check
        working-directory: ./src-tauri
        run: cargo check --locked

      # Plain `cargo test` skips `#[ignore]`d tests, which is what we want: those
      # are reserved for checks that need `claude` on PATH plus auth and tokens, so
      # they belong to the release checklist (`cargo test -- --ignored`), not a PR gate.
      - name: Cargo test
        working-directory: ./src-tauri
        run: cargo test --locked

      # Lint signal only — does not fail the build on warnings, so a pre-existing
      # style nit can't block an unrelated PR.
      - name: Clippy (non-blocking)
        working-directory: ./src-tauri
        run: cargo clippy --all-targets || true
