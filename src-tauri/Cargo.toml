[package]
name = "episko"
version = "0.1.0"
description = "A launcher/manager for many coding-agent sessions"
authors = ["Respeak"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "episko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# `tauri::test::mock_app()` — an App that runs without spawning a window, so the
# telemetry server (which needs a real AppHandle to emit through) can be driven
# end-to-end in a unit test. Dev-only: the feature is unified into the test build,
# never into a release bundle.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
portable-pty = "0.9.0"
tiny_http = "0.12.0"
base64 = "0.22.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Terminal copy/paste. The WebView's own `navigator.clipboard.readText()` is behind
# a permission prompt in both WebView2 and WKWebView (see the comment in `run()`),
# so the clipboard is read and written from the host side instead.
tauri-plugin-clipboard-manager = "2"
# Runnable discovery: .episko/tasks.toml, and format-preserving writes back to it.
toml = "0.9"
toml_edit = "0.25.13"
# .vscode/tasks.json and launch.json are JSONC — VS Code's own template ships
# comments and trailing commas, which serde_json rejects.
jsonc-parser = { version = "0.33.0", features = ["serde"] }
# Crash forensics: rolling file log + panic hook. The app previously wrote no
# logs at all — a panic that unwound out of main left zero trace on disk.
log = "0.4"
tauri-plugin-log = "2"
# Process-table introspection (external-session liveness + ancestry) without
# spawning `ps`/`tasklist` — one in-process snapshot, same code on every OS.
# 0.38 (not latest) because newer sysinfo raises MSRV past our rustc.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# "Which ports are our sessions listening on" — the ground truth behind the header's
# running-server list, where a parsed log line is only ever a guess about somebody
# else's output format. Native APIs on every platform (GetExtendedTcpTable, libproc,
# /proc), so this stays spawn-free like `ProcTable` beside it, and it needs no bindgen
# (netstat2, the obvious alternative, drags in bindgen + clang-sys and so a system
# LLVM on both CI runners).
#
# The cost, and it is a real one: on Windows this resolves `windows` 0.62 alongside
# the 0.61 tauri already uses — a second copy of a large binding crate, which is
# exactly what the windows-sys note below avoids. Taken deliberately: the alternative
# is hand-written libproc FFI for macOS, unverifiable from a Windows machine, in the
# one place where a wrong answer means the app reports a port that does not exist.
listeners = "0.6"

# `SetThreadExecutionState` for the keep-awake control — Windows' answer to
# macOS `caffeinate` — the window APIs behind `focus_external_session`
# (`EnumWindows` + `SetForegroundWindow`, Windows' answer to the AppleScript
# half) — and `RestartManager`, which answers "which processes have this file
# open", the API the Windows installer stack uses for exactly that question and
# the only way to name the editor or watcher pinning a worktree folder we have
# just been asked to delete. 0.61 is the version tauri already resolves, so this
# adds features to an existing crate rather than a second copy of windows-sys.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_Power",
  "Win32_System_RestartManager",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  # `ReadConsoleInputW` — the PTY round-trip test's child reads its secret exactly the
  # way `_getwch` (and so Python's `getpass`) does: key-DOWN records only. Reading it
  # any other way would pass while the bug it guards is present.
  "Win32_System_Console",
] }

# macOS-only: read the pre-rename WebKit localStorage SQLite to recover cost/
# roster data stranded when the bundle id changed (`read_legacy_localstorage`).
# `bundled` compiles SQLite in so CI needn't rely on system headers. Windows'
# WebView2 uses LevelDB, not SQLite, so this dep is scoped to macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

# ---------------------------------------------------------------------------
# Temporary: a forked `muda` that does not leak a GDI handle per icon menu item.
#
# `WinIcon::to_hbitmap` mints a `CreateDIBSection` handle for every icon item
# added to a menu and hands it to `SetMenuItemInfoW` as `hbmpItem`, which stores
# it without taking ownership. Nothing ever deletes it. `update_tray` rebuilds
# the whole tray menu whenever the sidebar's wording changes, so that is one
# leaked handle per session row per rebuild — unbounded, and invisible until the
# process hits Windows' default 10,000-per-process GDI quota. After that every
# `CreateIcon` returns NULL, so every rebuild fails and the tray menu freezes at
# whatever it last drew. Because `CreateIcon` does not set last-error on that
# path, the failure reads as the nonsense `OS error when instantiating the icon:
# Os { code: 0, message: "The operation completed successfully." }`, and
# `tray.ts` retries on the next paint, so the log fills at ~1.5 lines/second.
# Measured on a 37h-old instance with 10 panes: GDI 9994, peak 10001.
#
# The fork caches the bitmap on the icon and releases it in the `Drop` that
# already calls `DestroyIcon`. Upstream issue: tauri-apps/muda#391.
#
# `[patch]` rather than a direct dependency because we do not depend on muda —
# `tauri` and `tray-icon` do, and both want `^0.19`; this redirects theirs.
# Cargo.lock pins the exact commit, so builds stay reproducible.
#
# **To go back**: delete this whole section and `cargo update -p muda`. Do that
# once a release carrying the upstream fix exists. If upstream never takes it,
# nothing needs doing — the fork is a branch off the `muda-v0.19.3` tag with one
# commit on it, and it only has to keep satisfying `^0.19`.
# ---------------------------------------------------------------------------
[patch.crates-io]
muda = { git = "https://github.com/Blaxzter/muda.git", branch = "fix/windows-menu-item-bitmap-leak" }
