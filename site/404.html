<!doctype html>

<head>
<meta charset="UTF-8" />

<meta name="robots" content="noindex" />

<style>
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/jetbrains-mono-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/space-grotesk-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
:root{--bg:#100e15;--text:#efecf5;--muted:#a49eb4;--muted-2:#736d84;--accent:#a78bfa;
  --hair:rgba(255,255,255,.07);--surface:#1b1824;
  --font-ui:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --font-display:"Space Grotesk",var(--font-ui);color-scheme:dark;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-ui);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:40px 20px;
  -webkit-font-smoothing:antialiased;}
pre{margin:0 0 22px;font-family:var(--font-mono);font-size:12px;line-height:1.25;color:var(--muted-2);}
pre b{color:var(--accent);font-weight:400;}
.code{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);}
h1{font-family:var(--font-display);font-weight:600;letter-spacing:-.02em;font-size:clamp(26px,5vw,38px);margin:10px 0 8px;}
p{color:var(--muted);margin:0 0 26px;font-size:15px;}
a.btn{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 20px;border-radius:999px;
  background:var(--surface);border:1px solid var(--hair);color:var(--muted);font-size:14px;font-weight:600;
  text-decoration:none;transition:color .2s,border-color .2s,transform .2s;}
a.btn:hover{color:var(--text);border-color:rgba(255,255,255,.2);transform:translateY(-1px);}
</style>
</head>
<body>

</html>
